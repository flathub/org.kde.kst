app-id: org.kde.kst
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: kst
rename-icon: kst
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /mkspecs
  - /share/aclocal
  - /share/info
  - /share/man
modules:

  - name: gsl
    sources:
      - type: archive
        url: https://ftpmirror.gnu.org/gsl/gsl-2.8.tar.gz
        sha256: 6a99eeed15632c6354895b1dd542ed5a855c0f15d9ad1326c6fe2b2c9e423190
        x-checker-data:
          type: anitya
          project-id: 1267
          url-template: https://ftpmirror.gnu.org/gsl/gsl-$version.tar.gz

  - name: cfitsio
    sources:
      - type: archive
        url: https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-4.6.4.tar.gz
        sha256: 227b637b91c9820ea96f39a65eb087f053de567d82f4338e2884f123f8183c55
        x-checker-data:
          type: anitya
          project-id: 270
          url-template: https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-$version.tar.gz

  - name: getdata
    config-opts:
      - --disable-bindings
      - --enable-cplusplus
    sources:
      - type: archive
        url: https://github.com/ketiltrout/getdata/releases/download/v0.11.0/getdata-0.11.0.tar.gz
        sha256: 082c241e04483c7cfbae5ad3ab9710d570051a888fb3f240f994b1cd61c9c26b
        x-checker-data:
          type: anitya
          project-id: 896
          url-template: https://github.com/ketiltrout/getdata/releases/download/v$version/getdata-$version.tar.gz

  - name: matio
    sources:
      - type: archive
        url: https://github.com/tbeu/matio/releases/download/v1.5.30/matio-1.5.30.tar.gz
        sha256: 8bd3b9477042ecc00dd71c04762fa58468e14cccc32fd8c6826c2da1e8bc3107
        x-checker-data:
          type: anitya
          project-id: 1893
          url-template: https://github.com/tbeu/matio/releases/download/v$version/matio-$version.tar.gz

  - name: hdf5
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DHDF5_ENABLE_ZLIB_SUPPORT=ON
      - -DHDF5_BUILD_CPP_LIB=ON
      - -DBUILD_STATIC_LIBS=OFF
    sources:
      - type: archive
        url: https://github.com/HDFGroup/hdf5/archive/refs/tags/2.1.1.tar.gz
        sha256: 5849ed7a81be6bc84ff8aa65dd966430adf0daf71e6bcb734b7a37474f92c859
        x-checker-data:
          type: anitya
          project-id: 1303
          url-template: https://github.com/HDFGroup/hdf5/releases/download/hdf5_$version/hdf5-$version.tar.gz

  - name: netcdf
    sources:
      - type: archive
        url: https://github.com/Unidata/netcdf-c/archive/v4.10.1.tar.gz
        sha256: 33c27231c478c3b35da7c7758fbdd02da1fe407abcb16ddfe195f69d164f930d
        x-checker-data:
          type: anitya
          project-id: 10354
          url-template: https://github.com/Unidata/netcdf-c/archive/v$version.tar.gz

  - name: netcdfcxx
    sources:
      - type: archive
        url: https://github.com/Unidata/netcdf-cxx4/archive/refs/tags/v4.3.1.tar.gz
        sha256: e3fe3d2ec06c1c2772555bf1208d220aab5fee186d04bd265219b0bc7a978edc
        x-checker-data:
          type: anitya
          project-id: 13548
          url-template: https://github.com/Unidata/netcdf-cxx4/archive/refs/tags/v$version.tar.gz
      - type: patch
        path: netcdf-cxx4-logging.patch

  - name: kst
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://invent.kde.org/graphics/kst-plot/-/archive/3.0.0/kst-plot-3.0.0.tar.gz
        sha256: c9c96030585d833fbb0344b7e67109f2343dfe98be6a3a5d4d55a19963d7316a
        x-checker-data:
          type: anitya
          project-id: 379732
          url-template: https://invent.kde.org/graphics/kst-plot/-/archive/v$version/kst-plot-v$version.tar.gz
      - type: patch
        paths:
          - vcs-browser.patch
          - screenshots.patch
          - version.patch
